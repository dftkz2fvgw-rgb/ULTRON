<style>
:root{--bg:#04060a;--pn:#0a0f16;--ln:#1f4560;--cy:#2cb5ff;--rd:#ff2e3e;--tx:#eaf1f8;--dm:#7d8da0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:500;font-size:17px;background:radial-gradient(circle at 85% -5%,rgba(255,46,62,.16),transparent 45%),radial-gradient(circle,rgba(44,181,255,.18) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{margin:0;font-size:44px;line-height:.95;font-weight:800;letter-spacing:.01em}
.sub{color:var(--dm);font-size:15px;margin:2px 0 0;text-transform:capitalize}
.top{display:flex;align-items:center;gap:16px;margin:10px 0 14px}
.reactor{position:relative;width:128px;height:128px;flex:none}
.reactor svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:60px 60px;animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pr{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.sc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.sc b{font-size:38px;font-weight:800;line-height:1}
.sc i{font-style:normal;font-size:13px;color:var(--rd);font-weight:700}
.st{flex:1;display:grid;gap:8px}
.st div{border-left:2px solid var(--cy);padding-left:10px}
.st small{display:block;color:var(--dm);font-size:14px;font-weight:700}
.st b{font-size:26px;font-weight:800;line-height:1}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tabs button{font:inherit;font-weight:800;font-size:15px;color:var(--tx);background:transparent;border:1px solid var(--ln);padding:11px 2px;cursor:pointer}
.tabs button.on{border-color:var(--rd);background:rgba(255,46,62,.16);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.pn{position:relative;background:var(--pn);border:1px solid var(--ln);padding:14px 14px 16px;margin-bottom:12px}
.pn::before,.pn::after{content:"+";position:absolute;color:var(--cy);font-weight:700;font-size:18px;line-height:1}
.pn::before{top:-10px;right:-6px}.pn::after{bottom:-10px;left:-6px}
h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:19px;font-weight:800}
h2::after{content:"";flex:1;height:1px;background:var(--ln)}
h2 span{order:2;color:var(--dm);font-size:15px}
.big{font-size:54px;font-weight:800;line-height:1}
.big small{font-size:20px;color:var(--dm);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number]{flex:1;min-width:0;font:inherit;font-weight:700;font-size:18px;color:var(--tx);background:#05090e;border:1px solid var(--ln);padding:9px 10px;border-radius:0}
.bt{font:inherit;font-weight:800;font-size:16px;color:var(--tx);background:transparent;border:1px solid #4a5d70;padding:9px 14px;cursor:pointer}
.bt.r{border-color:var(--rd);background:rgba(255,46,62,.18)}
.bt.c{border-color:var(--cy);background:rgba(44,181,255,.14)}
.bar{height:8px;background:#0e1822;border:1px solid var(--ln);margin-top:10px}
.bar i{display:block;height:100%;background:var(--cy);transition:width .5s}
.bar.r i{background:var(--rd)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #12222f}
.li:first-of-type{border-top:0}
.li .n{flex:1;min-width:0;overflow-wrap:anywhere}
.li small{color:var(--dm);font-size:15px}
.ck{width:32px;height:32px;flex:none;border:1px solid var(--cy);background:transparent;color:var(--bg);font:800 20px/1 inherit;cursor:pointer}
.ck.on{background:var(--cy)}
.x{background:none;border:0;color:var(--dm);font:700 20px/1 inherit;cursor:pointer;padding:6px}
.pos{color:var(--cy)}.neg{color:var(--rd)}
.vide{color:var(--dm);margin:4px 0 10px}
input[type=range]{width:100%;accent-color:var(--rd);margin:8px 0 0}
.foot{color:var(--dm);font-size:14px;text-align:center;margin-top:18px}
canvas{display:block;width:100%;height:260px;touch-action:pan-y;cursor:grab}
.om h1,.om .sub,.om .top,.om .foot,.om #tabs{display:none}
body.om{overflow:hidden;height:100svh}
.om main{padding:14px 0}
.mic{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:2px solid var(--rd);background:rgba(255,46,62,.16);cursor:pointer;z-index:5}
.mic::after{content:'';position:absolute;inset:16px;border-radius:50%;background:var(--rd)}
.cap{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:20px;padding:0 24px;pointer-events:none;text-shadow:0 0 12px #000}
:root{--ln:rgba(255,255,255,.12);--cy:#5ac8ff;--rd:#ff4d6a}
body{font-family:Sora,system-ui,-apple-system,sans-serif;font-weight:400;font-size:15px;background:radial-gradient(ellipse at 15% -10%,rgba(90,110,255,.28),transparent 50%),radial-gradient(ellipse at 95% 8%,rgba(255,77,106,.2),transparent 45%),#05070d}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.pn{border-radius:22px;padding:18px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pn::before,.pn::after{display:none}
h2{font-size:13px;font-weight:600;color:var(--dm)}
.big{font-weight:700;letter-spacing:-.03em}
.bt,.tabs button,input[type=text],input[type=number],input[type=datetime-local]{border-radius:14px}
.bt{border:1px solid var(--ln);background:rgba(255,255,255,.07);font-weight:600;font-size:14px;padding:11px 16px}
.bt.r{background:linear-gradient(135deg,#ff4d6a,#c2185b);border-color:transparent}
.bt.c{background:linear-gradient(135deg,#2f9bff,#5ac8ff);border-color:transparent;color:#04121f}
input[type=text],input[type=number],input[type=datetime-local]{min-width:0;flex:1;font:inherit;font-weight:500;font-size:15px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--ln);padding:11px 12px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);border:0;overflow:hidden}.bar i{border-radius:6px}
.ck{border-radius:50%;border-color:var(--ln)}
.tabs button{border:1px solid var(--ln);background:rgba(255,255,255,.07);font-weight:600;font-size:14px}
.st div{border-left:0;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px}
.li{border-top-color:rgba(255,255,255,.08)}
.ban{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:60;padding:16px;border-radius:20px;background:rgba(20,24,36,.9);backdrop-filter:blur(20px);border:1px solid var(--rd);display:grid;gap:8px;max-width:536px;margin:0 auto}
:root{--rd:#3d7bff;--cy:#5aa8ff}
body{background:radial-gradient(ellipse at 20% -10%,rgba(40,90,255,.3),transparent 50%),radial-gradient(ellipse at 90% 10%,rgba(0,50,160,.35),transparent 45%),#02040a}
.neg{color:#ff6b7a}
.bt.r{background:linear-gradient(135deg,#2459ff,#0a1f6b)}
.mic{border-color:#3d7bff;background:rgba(61,123,255,.18)}.mic::after{background:#3d7bff}
.gst{position:fixed;left:calc(50% - 98px);bottom:calc(28px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;border:2px solid #3d7bff;background:transparent;cursor:pointer;z-index:5}
.gst::after{content:'';position:absolute;inset:10px;border:2px solid #3d7bff;border-radius:4px}
.gst.on{background:rgba(61,123,255,.35)}
body.om{background:radial-gradient(ellipse at 50% 42%,#06122a 0%,#030814 45%,#010207 100%)}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-around;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px));z-index:4;pointer-events:none;border-bottom:1px solid rgba(70,160,230,.18);padding-bottom:10px}
.hud div{text-align:center;min-width:0}
.hud small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5f88aa}
.hud b{font-size:15px;font-weight:600;color:#6fc3ff;font-variant-numeric:tabular-nums}
.cap{font-size:18px;max-height:30svh;overflow:hidden}
body:not(.om) main{padding-bottom:116px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;min-width:0}
.sum small{display:block;color:var(--dm);font-size:12px}
.sum b{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.cg small{color:var(--dm);font-size:12px;padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:12px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;padding:0}
.cd.today{box-shadow:inset 0 0 0 1px #3d7bff}
.cd.sel{background:linear-gradient(135deg,#2459ff,#0a1f6b)}
.cd i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#6fc3ff}
input[type=time]{flex:0 0 auto;font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;color-scheme:dark}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),480px);display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px;border-radius:999px;background:rgba(10,20,50,.72);border:1px solid rgba(140,180,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
.dock:focus-within{border-color:#8ab8ff}
.dock input{flex:1;min-width:0;background:transparent!important;border:0!important;border-radius:0!important;padding:10px 0!important;font-size:16px!important;color:var(--tx);outline:none}
.sendb{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#2f7bff,#6fb0ff);cursor:pointer;flex:none;position:relative}
.sendb::after{content:"";position:absolute;left:12px;top:15px;width:9px;height:9px;border-top:2.5px solid #04121f;border-right:2.5px solid #04121f;transform:rotate(45deg)}
.cap{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.flash{animation:fl .9s}
@keyframes fl{0%{color:#fff;text-shadow:0 0 22px #2cb5ff}100%{text-shadow:none}}
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-content:center;font-weight:800;font-size:20px;line-height:1.7;animation:bo 2.6s forwards;pointer-events:none}
#boot b{color:var(--rd);font-size:40px;display:block;margin-bottom:6px}
#boot span{display:block;opacity:0;animation:ln .3s forwards}
@keyframes ln{to{opacity:1}}
@keyframes bo{0%,75%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#boot{display:none}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}#pr,.bar i{transition:none}}
#start{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 40%,#0a1d46 0%,#02050f 72%);display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px}
#start b{font-size:44px;font-weight:700;letter-spacing:-.02em}
#start p{color:var(--dm);max-width:32ch;margin:0 0 6px;line-height:1.5}
#start .bt{width:min(320px,100%);padding:15px 16px;font-size:16px}
#vst{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid rgba(140,180,255,.28);background:rgba(10,20,50,.72);color:var(--dm);cursor:pointer;font:inherit;font-size:12px}
#vst::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5f88aa;margin-right:7px}
#vst.lis::before{background:#6fc3ff}
#vst.on::before{background:#4ade80}

</style></head>
<body><main>
<h1>JARVIS</h1>
<p class="sub" id="dt"></p>
<div class="top">
 <div class="reactor"><svg viewBox="0 0 120 120">
  <circle class="spin" cx="60" cy="60" r="58" fill="none" stroke="#2cb5ff" stroke-width="1.5" stroke-dasharray="3 7"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#2cb5ff" stroke-width="3" opacity=".9"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="#0c1a3d" stroke-width="7"/>
  <circle id="pr" cx="60" cy="60" r="42" fill="none" stroke="#3d7bff" stroke-width="7" stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 60 60)"/>
 </svg><div class="sc"><b id="sc">0</b><i>SYNC</i></div></div>
 <div class="st">
  <div><small>HABITUDES</small><b id="s1">0/0</b></div>
  <div><small>SOLDE</small><b id="s2">0 €</b></div>
  <div><small>OBJECTIFS</small><b id="s3">0 %</b></div>
 </div>
</div>
<nav class="tabs" id="tabs"></nav>
<section id="v"></section>
<div id="boot"><b>JARVIS</b><span style="animation-delay:.2s">Initialisation du système…</span><span style="animation-delay:.8s">Scan du corps : OK</span><span style="animation-delay:1.4s">Synchronisation des finances : OK</span></div>
<p class="foot">Données enregistrées sur cet appareil.</p>
</main>
<div id="start"><b>JARVIS</b><p>Touche une fois pour activer l’écoute. Ensuite, parle-moi naturellement, sans rien toucher.</p><button class="bt r" id="go1" onclick="boot(false)">Démarrer</button><button class="bt c" id="go2" onclick="boot(true)">Démarrer avec la caméra</button></div><button id="vst" onclick="toggleMic()" aria-label="Micro">Micro coupé</button><button id="camb" onclick="toggleHands()" aria-label="Gestes de la main"></button><video id="hvid" playsinline muted></video>

<script>
const K="jarvis-v1";
let S={log:{},habits:[],tx:[],budget:0,goals:[],debts:[],rem:[],sav:{goal:0,items:[]}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const td=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>Math.round(n).toLocaleString("fr-FR")+" €";
const L=()=>S.log[td()]||(S.log[td()]={w:null,water:0,sleep:0,train:false});
const bar=(p,c)=>`<div class="bar ${c||""}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
let tab="orb";
const TABS=[["orb","ORBE"],["corps","CORPS"],["hab","HABITUDES"],["arg","ARGENT"],["det","DETTES"],["obj","OBJECTIFS"]];

function streak(h){let n=0,d=new Date();if(!h.days.includes(td()))d.setDate(d.getDate()-1);
 for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(h.days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function score(){const l=L(),p=[(Math.min(l.water/8,1)+Math.min(l.sleep/8,1)+(l.train?1:0))/3];
 if(S.habits.length)p.push(S.habits.filter(h=>h.days.includes(td())).length/S.habits.length);
 if(S.goals.length)p.push(S.goals.reduce((a,g)=>a+g.p,0)/S.goals.length/100);
 return Math.round(p.reduce((a,b)=>a+b,0)/p.length*100)}
function head(){const s=score(),dn=S.habits.filter(h=>h.days.includes(td())).length;
 $("#sc").textContent=s;$("#pr").style.strokeDashoffset=263.9*(1-s/100);
 $("#s1").textContent=dn+"/"+S.habits.length;
 $("#s2").textContent=eur(S.tx.reduce((a,t)=>a+t.a,0));
 $("#s3").textContent=(S.goals.length?Math.round(S.goals.reduce((a,g)=>a+g.p,0)/S.goals.length):0)+" %"}

function spark(){const pts=Object.keys(S.log).sort().filter(k=>S.log[k].w).slice(-14).map(k=>S.log[k].w);
 if(pts.length<2)return`<p class="vide">Enregistre ton poids sur 2 jours pour voir la courbe.</p>`;
 const mn=Math.min(...pts),mx=Math.max(...pts),r=(mx-mn)||1;
 const xy=pts.map((v,i)=>[10+i*(280/(pts.length-1)),60-(v-mn)/r*50]);
 return`<svg viewBox="0 0 300 70" style="width:100%;margin-top:10px"><polyline points="${xy.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#2cb5ff" stroke-width="2"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#ff2e3e"/>`).join("")}</svg>`}

const V={
orb(){return`<div class='pn' style='padding:6px'><canvas id='cv' style='height:min(60vh,440px);touch-action:none'></canvas><p class='vide' style='text-align:center;margin:4px 0 0'>Glisse pour tourner, pince pour zoomer. Touche un module ou zoome dessus pour l’ouvrir.</p></div>
<div class='pn'><h2>PARLER À JARVIS<span id='vs'>PRÊT</span></h2><div class='row'><button class='bt r' onclick='listen()'>Parler</button><input type='text' id='cmdi' placeholder='ou écris une commande'><button class='bt c' onclick='runTxt()'>Envoyer</button></div><p class='vide' id='sayt' style='margin-top:10px'>Essaie : « j’ai bu un verre d’eau », « dépense 12 euros café », « ouvre dettes ».</p></div>`},
corps(){const l=L();return`
<div class="pn"><h2>MODÈLE 360<span>SCAN EN DIRECT</span></h2><canvas id="cv" height="260"></canvas><p class="vide" style="margin:6px 0 0">Tête : sommeil. Torse : eau. Membres : séance. Cyan = objectif atteint, rouge = en retard. Glisse pour tourner, pince pour zoomer, double-touche pour recentrer.</p></div>
<div class="pn"><h2>MASSE<span>KG</span></h2>
 <div class="big">${l.w!=null?l.w:"--"}<small> kg</small></div>
 <div class="row" style="margin-top:10px"><input type="number" id="w" inputmode="decimal" step="0.1" placeholder="Poids du jour"><button class="bt r" onclick="setW()">Enregistrer</button></div>${spark()}</div>
<div class="pn"><h2>HYDRATATION<span>OBJECTIF 8</span></h2>
 <div class="row"><div class="big">${l.water}<small> / 8 verres</small></div><span style="flex:1"></span><button class="bt" onclick="wat(-1)">−</button><button class="bt c" onclick="wat(1)">+ Verre</button></div>${bar(l.water/8*100)}</div>
<div class="pn"><h2>SOMMEIL<span>OBJECTIF 8 H</span></h2>
 <div class="row"><input type="number" id="sl" inputmode="decimal" step="0.5" placeholder="Heures dormies" value="${l.sleep||""}"><button class="bt c" onclick="setSl()">Enregistrer</button></div>${bar(l.sleep/8*100,"r")}</div>
<div class="pn"><h2>ENTRAÎNEMENT</h2>
 <div class="row"><div class="big" style="font-size:30px">${l.train?"Séance faite":"Pas encore de séance"}</div><span style="flex:1"></span><button class="bt ${l.train?"c":"r"}" onclick="trn()">${l.train?"Annuler":"Séance faite"}</button></div></div>`},
hab(){const t=td();return`
<div class="pn"><h2>HABITUDES<span>AUJOURD’HUI</span></h2>
 ${S.habits.length?S.habits.map((h,i)=>{const on=h.days.includes(t),s=streak(h);return`<div class="li"><button class="ck ${on?"on":""}" onclick="tgH(${i})" aria-label="Valider">${on?"✓":""}</button><div class="n">${esc(h.n)}<br><small>${s} jour${s>1?"s":""} d’affilée</small></div><button class="x" onclick="delH(${i})" aria-label="Supprimer">×</button></div>`}).join(""):`<p class="vide">Aucune habitude. Ajoute la première, par exemple « Boire 2 L d’eau ».</p>`}
 <div class="row" style="margin-top:12px"><input type="text" id="nh" placeholder="Nouvelle habitude"><button class="bt r" onclick="addH()">Ajouter</button></div></div>`},
arg(){const m=td().slice(0,7),sp=-S.tx.filter(t=>t.d.startsWith(m)&&t.a<0).reduce((a,t)=>a+t.a,0),b=S.budget||0;
 return`
${V.eco()}
<div class="pn"><h2>SOLDE<span>TOTAL</span></h2>
 <div class="big">${eur(S.tx.reduce((a,t)=>a+t.a,0))}</div>
 <div class="row" style="margin-top:12px"><input type="text" id="tl" placeholder="Libellé"><input type="number" id="ta" inputmode="decimal" placeholder="€" style="max-width:96px"></div>
 <div class="row" style="margin-top:8px"><button class="bt c" onclick="addT(1)">+ Revenu</button><button class="bt r" onclick="addT(-1)">− Dépense</button></div></div>
<div class="pn"><h2>BUDGET DU MOIS<span>${b?eur(sp)+" / "+eur(b):"NON DÉFINI"}</span></h2>
 ${b?bar(sp/b*100,sp>b?"r":""):`<p class="vide">Fixe un plafond de dépenses pour suivre le mois.</p>`}
 <div class="row" style="margin-top:12px"><input type="number" id="bg" inputmode="decimal" placeholder="Budget mensuel en €" value="${b||""}"><button class="bt" onclick="setB()">Fixer</button></div></div>
<div class="pn"><h2>MOUVEMENTS<span>RÉCENTS</span></h2>
 ${S.tx.length?S.tx.slice(0,8).map((t,i)=>`<div class="li"><div class="n">${esc(t.l)}<br><small>${t.d}</small></div><b class="${t.a>0?"pos":"neg"}">${t.a>0?"+":"−"}${eur(Math.abs(t.a))}</b><button class="x" onclick="delT(${i})" aria-label="Supprimer">×</button></div>`).join(""):`<p class="vide">Aucun mouvement enregistré.</p>`}</div>`},
det(){const tot=S.debts.reduce((a,d)=>a+d.t,0),rest=S.debts.reduce((a,d)=>a+d.t-d.p,0),tg=S.debts.filter(d=>d.p<d.t).sort((a,b)=>(a.t-a.p)-(b.t-b.p))[0];return`
<div class="pn"><h2>DETTES<span>RESTE À PAYER</span></h2><div class="big neg">${eur(rest)}</div>${bar(tot?(tot-rest)/tot*100:0,"r")}${tot?`<p class="vide">${eur(tot-rest)} remboursés sur ${eur(tot)}. ${tg?"Prochaine cible : "+esc(tg.n)+", la plus petite à solder.":"Tout est soldé."}</p>`:""}</div>
<div class="pn"><h2>DÉTAIL<span>${S.debts.length}</span></h2>${S.debts.length?S.debts.map((d,i)=>{const r=d.t-d.p;return`<div class="li" style="display:block"><div class="row"><div class="n"><b>${esc(d.n)}</b><br><small>${r>0?eur(r)+" restants sur "+eur(d.t):"Soldée"}</small></div><button class="x" onclick="delD(${i})" aria-label="Supprimer">×</button></div>${bar(d.p/d.t*100,r>0?"r":"")}${r>0?`<div class="row" style="margin-top:10px"><input type="number" id="dp${i}" inputmode="decimal" placeholder="Montant payé"><button class="bt c" onclick="payD(${i})">Payer</button></div>`:""}</div>`}).join(""):`<p class="vide">Aucune dette enregistrée.</p>`}
 <div class="row" style="margin-top:12px"><input type="text" id="dnm" placeholder="Nom de la dette"><input type="number" id="dtt" inputmode="decimal" placeholder="Total €" style="max-width:110px"></div><button class="bt r" style="margin-top:8px" onclick="addDt()">Ajouter la dette</button></div>`},
eco(){const t=svT(),g=S.sav.goal;return`
<div class="pn"><h2>TIRELIRE<span>${g?Math.round(Math.min(t/g,1)*100)+" %":"SANS OBJECTIF"}</span></h2><canvas id="cv" height="260"></canvas>
 <div class="big" id="sv" style="text-align:center">${eur(t)}</div><p class="vide" style="text-align:center">${g?"Objectif : "+eur(g)+(t>=g?", atteint":", encore "+eur(g-t)):"Fixe un objectif pour remplir la sphère."}</p>
 <div class="row"><input type="number" id="ea" inputmode="decimal" placeholder="Montant (vide = tout casser)"><button class="bt c" onclick="dep(1)">Déposer</button><button class="bt r" onclick="dep(-1)">Casser</button></div></div>
<div class="pn"><h2>OBJECTIF DE LA TIRELIRE</h2><div class="row"><input type="number" id="eg" inputmode="decimal" placeholder="Montant visé en €" value="${g||""}"><button class="bt r" onclick="setGoal()">Fixer</button></div></div>`},
obj(){return`
<div class="pn"><h2>OBJECTIFS<span>${S.goals.length}</span></h2>
 ${S.goals.length?S.goals.map((g,i)=>`<div class="li" style="display:block"><div class="row"><div class="n"><b>${esc(g.n)}</b></div><b class="neg">${g.p} %</b><button class="x" onclick="delG(${i})" aria-label="Supprimer">×</button></div>${bar(g.p,"r")}<input type="range" min="0" max="100" step="5" value="${g.p}" onchange="setG(${i},this.value)" aria-label="Avancement"></div>`).join(""):`<p class="vide">Aucun objectif. Ajoute-en un, par exemple « Économiser 5 000 € ».</p>`}
 <div class="row" style="margin-top:12px"><input type="text" id="ng" placeholder="Nouvel objectif"><button class="bt r" onclick="addG()">Ajouter</button></div></div>`}
};

function render(){
 $("#tabs").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("");
 $("#v").innerHTML=V[tab]();head();document.body.classList.toggle('om',tab==='orb');$('#tabs').innerHTML=tab==='orb'?'':'<button onclick="goOrb()">◀ Orbe</button>';if(tab==='orb'&&pt!=='orb')zm=1.6;pt=tab}
const num=s=>parseFloat(String(s).replace(",","."));
function setW(){const v=num($("#w").value);if(v>0){L().w=v;save();render()}}
function wat(d){const l=L();l.water=Math.max(0,l.water+d);save();render()}
function setSl(){const v=num($("#sl").value);if(v>=0){L().sleep=v;save();render()}}
function trn(){const l=L();l.train=!l.train;save();render()}
function tgH(i){const h=S.habits[i],k=h.days.indexOf(td());k<0?h.days.push(td()):h.days.splice(k,1);save();render()}
function addH(){const n=$("#nh").value.trim();if(n){S.habits.push({n,days:[]});save();render()}}
function delH(i){S.habits.splice(i,1);save();render()}
function addT(s){const a=num($("#ta").value);if(a>0){S.tx.unshift({d:td(),l:$("#tl").value.trim()||"Sans titre",a:s*a});save();render()}}
function delT(i){S.tx.splice(i,1);save();render()}
function setB(){const v=num($("#bg").value);S.budget=v>0?v:0;save();render()}
function addG(){const n=$("#ng").value.trim();if(n){S.goals.push({n,p:0});save();render()}}
function setG(i,v){S.goals[i].p=+v;save();render()}
function delG(i){S.goals.splice(i,1);save();render()}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;let flash=0,boom=0,zm=1.6,held=0,A=.6,lt=0,B=.25,mv=0,NP=[],pt='',ct=0,P={};
const svT=()=>S.sav.items.reduce((a,i)=>a+i.a,0);
function addDt(){const n=$("#dnm").value.trim(),t=num($("#dtt").value);if(n&&t>0){S.debts.push({n,t,p:0});save();render()}}
function payD(i){const a=num($("#dp"+i).value);if(a>0){const d=S.debts[i];d.p=Math.min(d.t,d.p+a);save();render()}}
function delD(i){S.debts.splice(i,1);save();render()}
function setGoal(){const v=num($("#eg").value);S.sav.goal=v>0?v:0;save();render()}
function countUp(f,t){const e=$("#sv");if(!e||RM)return;e.className="big flash";const s=performance.now();(function st(n){const k=Math.min((n-s)/900,1);e.textContent=eur(f+(t-f)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)})(s)}
function dep(s){let a=num($("#ea").value);const o=svT();if(s<0&&!(a>0))a=o;if(!(a>0)||(s<0&&a>o))return;S.sav.items.push({d:td(),a:s*a});if(s>0)flash=1;else boom=1;save();render();countUp(o,svT())}
function mk(){const b=[],cy=(x,y0,y1,rx,rz,n,rows,g)=>{for(let r=0;r<rows;r++){const y=y0+(y1-y0)*r/(rows-1);for(let i=0;i<n;i++){const a=i/n*6.283;b.push([x+rx*Math.cos(a),y,rz*Math.sin(a),g])}}};
 for(let r=0;r<9;r++){const a=r/8*3.1416,rad=.13*Math.sin(a);for(let i=0;i<12;i++){const t=i/12*6.283;b.push([rad*Math.cos(t),.82+.13*Math.cos(a),rad*Math.sin(t),0])}}
 cy(0,.66,.05,.26,.13,16,14,1);[-1,1].forEach(s=>{cy(s*.38,.62,-.12,.06,.06,7,10,2);cy(s*.12,.02,-.95,.09,.09,8,14,3)});
 const g=[];for(let i=0;i<420;i++){const y=1-2*(i+.5)/420,r=Math.sqrt(1-y*y),a=i*2.39996;g.push([r*Math.cos(a),y,r*Math.sin(a),0])}const o=[];for(let i=0;i<150;i++){const y=1-2*(i+.5)/150,r=Math.sqrt(1-y*y),a=i*2.39996;o.push([r*Math.cos(a),y,r*Math.sin(a)])}
 const e=[];for(let i=0;i<150;i++)for(let j=i+1;j<150;j++)if(Math.hypot(o[i][0]-o[j][0],o[i][1]-o[j][1],o[i][2]-o[j][2])<.4)e.push([i,j]);
 const du=[];for(let i=0;i<90;i++){const y=Math.random()*2-1,r=Math.sqrt(1-y*y),a=Math.random()*6.283,m=1.15+Math.random()*.35;du.push([r*Math.cos(a)*m,y*m,r*Math.sin(a)*m])}
 const rg=[];for(let i=0;i<120;i++){const a=i/120*6.283;rg.push([1.22*Math.cos(a),0,1.22*Math.sin(a)])}
 P={body:b,globe:g,o,e,du,rg}}
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-lt)/1000,.1);lt=t;if(!held&&!RM)A+=dt*.7*spinDir;if(swV){A+=swV*dt;swV*=Math.pow(.05,dt);if(Math.abs(swV)<.05)swV=0}const c=document.getElementById("cv");if(!c)return;const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
 const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(tab==="orb"){orb(x,w,h,t);return}
 const gl=tab==="arg",ps=gl?P.globe:P.body,ang=A,co=Math.cos(ang),si=Math.sin(ang),sc=(gl?h*.4:h*.46)*zm,l=L(),v=[Math.min(l.sleep/8,1),Math.min(l.water/8,1),l.train?1:.2,l.train?1:.2],g=S.sav.goal,pr=g>0?Math.min(svT()/g,1):0,sy=RM?9:((t/1000*.6)%2)-1;flash*=.96;boom*=.975;const f=1+boom*(1-boom)*5;
 for(const p of ps){const X=(p[0]*co+p[2]*si)*f,Z=(-p[0]*si+p[2]*co)*f,k=1/(1+Z*.3),px=w/2+X*sc*k,py=h/2-p[1]*f*sc*k,on=(p[1]+1)/2<=pr;let col,a=.35+.4*(Z+1)/2,r=1.3*k;
  if(gl){col=on?"44,181,255":"60,90,115";if(!on)a*=.5}else col=v[p[3]]>=.7?"44,181,255":"255,46,62";
  if(!gl&&Math.abs(p[1]-sy)<.05){col="255,255,255";a=1;r*=1.8}
  if(gl&&on&&flash>.05){col="255,255,255";a=Math.min(1,a+flash);r*=1+flash}
  if(gl&&boom>.05){col="255,46,62";a=Math.min(1,a+.4)}

 }catch(e){if(e&&e.name==='AbortError')return;turns.pop();speakingUntil=0;const ce=document.getElementById('sayt');if(ce){ce.textContent='Erreur : '+(e&&e.message||e);clearTimeout(ct);ct=setTimeout(()=>{ce.textContent=''},15000)}say('Je n’arrive pas à joindre mon cerveau. Vérifie ta connexion.')}};
/* ---- Commandes : aide, recherche, correction, phrases multiples ---- */
const _cmd8=cmd;
const agentOK=()=>!!CFG.key&&navigator.onLine!==false;
cmd=function(t){const s=N(t),sa=s.replace(/['’\-]/g,' ').replace(/[?!.,;:]/g,' ').replace(/\s+/g,' ').trim();
 if(DICT!==null||JD!==null)return _cmd8(t);
 if(/^(ouvre |montre |affiche |va sur )?(l |la |les )?(aide|liste des commandes|commandes|page d aide)$/.test(sa)||/(que sais tu faire|quelles sont (tes|les) commandes|qu est ce que tu sais faire|aide moi a utiliser|comment ca marche)/.test(sa)){userSpoke=true;goTo('aide');return say('Voici l’aide.')}
 if(/(ouvre|montre|affiche|va sur) (la )?recherche$/.test(sa)){userSpoke=true;goTo('rech');return say('Que veux-tu chercher ?')}
 /* corrections locales */
 let m;
 if(/(supprime|efface|enleve|retire)/.test(sa)&&/derni(er|ere) (depense|operation|mouvement|revenu)/.test(sa)&&S.tx.length){const x=S.tx.shift();return ok('J’ai supprimé : '+x.l+', '+eur(Math.abs(x.a))+'.')}
 if(/(corrige|modifie|change|rectifie)/.test(sa)&&/derni(er|ere) (depense|operation|mouvement|revenu)/.test(sa)&&S.tx.length){const n=(sa.match(/(\d+(?:[.,]\d+)?)/)||[])[1];if(n&&num(n)>0){const x=S.tx[0];x.a=(x.a<0?-1:1)*num(n);return ok('C’est corrigé : '+x.l+', '+eur(num(n))+'.')}goTo('arg');return say('Touche le crayon à côté du mouvement à corriger.')}
 if(/(modifie|corrige|change|rectifie)/.test(sa)&&/derniere note/.test(sa)&&S.notes.length){goTo('not');setTimeout(()=>edNote(S.notes[0].id),900);return say('Voici ta dernière note.')}
 if(m=sa.match(/renomme (?:l )?habitude (.+?) (?:en|par) (.+)$/)){const k=m[1],h=S.habits.find(h=>N(h.n).includes(k));if(h){h.n=cap1(m[2].trim());return ok('Habitude renommée.')}}
 /* recherche */
 const isSearch=(/\b(cherche|recherche|retrouve|trouve)\b/.test(sa)&&/(note|journal|depense|achat|memoire|ecrit)/.test(sa))||(/\b(combien|qu est ce que|quelles?|quel)\b/.test(sa)&&/\b(depense|depenses|depense|achete|paye|claque|rentre|recu)\b/.test(sa)&&!/(ce mois ci|ce mois)$/.test(sa)&&!/(budget|reste)/.test(sa))||(/(qu est ce que j ai|ce que j ai) (ecrit|note|dit)/.test(sa));
 if(isSearch){userSpoke=true;if(agentOK())return ask(t);SQ=sa.replace(/\b(cherche|recherche|retrouve|trouve|dans mes notes|dans mon journal)\b/g,'').trim();say(searchSummary(t));goTo('rech');return}
 /* plusieurs actions dans une phrase -> Claude */
 if(agentOK()){const cats=[/(\d|un|deux|trois|quatre|cinq|dix|vingt)\s?(euros?|€|balles?|boules?|eur)\b|depens|achet|\bpaye|\bcout/,/dormi|couche|reveille|sommeil/,/\b(bu|verres?|eau)\b/,/seance|sport|muscu|entrain|couru|footing/,/\bpese|poids|kilos?\b/,/rappel/,/\bnote\b/,/calendrier|agenda|rendez vous/,/habitude/,/\b(retiens|souviens)\b/].reduce((a,r)=>a+(r.test(sa)?1:0),0);
  if(cats>=2){userSpoke=true;return ask(t)}}
 _cmd8(t)};
